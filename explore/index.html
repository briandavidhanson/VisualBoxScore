<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Stats Explorers</title>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #fafafa;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}
h1 {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 16px;
}
.tab-bar {
  display: flex;
  border-bottom: 2px solid #16213e;
  margin-bottom: 0;
}
.tab-btn {
  padding: 10px 24px;
  cursor: pointer;
  border: none;
  background: transparent;
  font-size: 14px;
  font-family: inherit;
  color: #666;
  border-radius: 6px 6px 0 0;
  transition: background 0.15s, color 0.15s;
}
.tab-btn:hover { background: #e8eaf0; color: #16213e; }
.tab-btn.active {
  background: #16213e;
  color: #fff;
  font-weight: 600;
}
.tab-panel { display: none; padding: 24px 0; }
.tab-panel.active { display: block; }
.controls {
  display: flex;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.control-group label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 4px;
}
.control-group select, .control-group input[type="number"] {
  height: 36px;
  border-radius: 4px;
  border: 1px solid #ccc;
  padding: 0 8px;
  font-size: 14px;
  font-family: inherit;
}
.control-group select { width: 340px; }
.stat-line {
  color: #888;
  font-size: 14px;
  margin-bottom: 24px;
}
/* Rate tab controls */
.rate-controls {
  display: flex;
  gap: 48px;
  align-items: flex-start;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.rate-controls label.group-label {
  font-weight: bold;
  margin-bottom: 4px;
  display: block;
}
.rate-controls .radio-group label,
.rate-controls .check-group label {
  display: block;
  cursor: pointer;
  font-size: 14px;
  padding: 2px 0;
}
.rate-controls input[type="radio"],
.rate-controls input[type="checkbox"] {
  margin-right: 6px;
}
</style>
</head>
<body>
<div class="container">
  <h1>NBA Stats Explorers</h1>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="season">Season Explorer</button>
    <button class="tab-btn" data-tab="player">Player Explorer</button>
    <button class="tab-btn" data-tab="rate">Rate vs Efficiency</button>
    <button class="tab-btn" data-tab="matchup">Matchup</button>
    <button class="tab-btn" data-tab="gamelog">Game Log</button>
  </div>

  <!-- ============ SEASON TAB ============ -->
  <div id="tab-season" class="tab-panel active">
    <p class="stat-line" id="season-stat-line"></p>
    <div class="controls">
      <div class="control-group">
        <label for="season-x">X-axis</label>
        <select id="season-x"></select>
      </div>
      <div class="control-group">
        <label for="season-y">Y-axis</label>
        <select id="season-y"></select>
      </div>
    </div>
    <div id="season-chart"></div>
  </div>

  <!-- ============ PLAYER TAB ============ -->
  <div id="tab-player" class="tab-panel">
    <p class="stat-line" id="player-stat-line"></p>
    <div class="controls">
      <div class="control-group">
        <label for="player-x">X-axis</label>
        <select id="player-x" style="width:300px"></select>
      </div>
      <div class="control-group">
        <label for="player-y">Y-axis</label>
        <select id="player-y" style="width:300px"></select>
      </div>
      <div class="control-group">
        <label for="player-team">Team</label>
        <select id="player-team" style="width:140px"></select>
      </div>
      <div class="control-group">
        <label for="player-min-poss">Min possessions</label>
        <input id="player-min-poss" type="number" value="200" min="0" step="50" style="width:100px">
      </div>
    </div>
    <div id="player-chart"></div>
  </div>

  <!-- ============ RATE TAB ============ -->
  <div id="tab-rate" class="tab-panel">
    <div class="rate-controls">
      <div>
        <label class="group-label">Side</label>
        <div class="radio-group">
          <label><input type="radio" name="rate-side" value=""> Offense</label>
          <label><input type="radio" name="rate-side" value="opp_"> Defense (opponent)</label>
          <label><input type="radio" name="rate-side" value="both" checked> Both</label>
        </div>
      </div>
      <div id="rate-options-container">
        <label class="group-label">Options</label>
        <label style="font-size:14px;cursor:pointer;display:block;padding:2px 0"><input type="checkbox" id="rate-show-avg" checked> Show averages</label>
        <label style="font-size:14px;cursor:pointer;display:block;padding:2px 0" id="rate-connect-label"><input type="checkbox" id="rate-connect-dots" checked> Connect team pairs</label>
      </div>
      <div id="rate-category-container">
        <label class="group-label">Categories</label>
        <div class="check-group" id="rate-categories"></div>
      </div>
    </div>
    <div id="rate-chart"></div>
  </div>

  <!-- ============ MATCHUP TAB ============ -->
  <div id="tab-matchup" class="tab-panel">
    <div class="rate-controls">
      <div>
        <label class="group-label">Away</label>
        <select id="matchup-away" style="height:36px;border-radius:4px;border:1px solid #ccc;padding:0 8px;font-size:14px;width:80px"></select>
      </div>
      <div style="display:flex;align-items:flex-end;padding-bottom:2px">
        <button id="matchup-swap" title="Swap home and away" style="height:36px;padding:0 8px;border:1px solid #ccc;border-radius:4px;background:#f5f5f5;cursor:pointer;font-size:16px">⇄</button>
      </div>
      <div>
        <label class="group-label">Home</label>
        <select id="matchup-home" style="height:36px;border-radius:4px;border:1px solid #ccc;padding:0 8px;font-size:14px;width:80px"></select>
      </div>
      <div>
        <label class="group-label">Ellipse</label>
        <div class="radio-group">
          <label><input type="radio" name="matchup-pct" value="0"> Off</label>
          <label><input type="radio" name="matchup-pct" value="0.5"> 50%</label>
          <label><input type="radio" name="matchup-pct" value="0.68" checked> 68%</label>
          <label><input type="radio" name="matchup-pct" value="0.8"> 80%</label>
          <label><input type="radio" name="matchup-pct" value="0.95"> 95%</label>
        </div>
      </div>
      <div>
        <label class="group-label">Show avg</label>
        <div class="radio-group">
          <label><input type="radio" name="matchup-avg" value="none"> None</label>
          <label><input type="radio" name="matchup-avg" value="offense"> Offense</label>
          <label><input type="radio" name="matchup-avg" value="defense"> Defense</label>
          <label><input type="radio" name="matchup-avg" value="both" checked> Both</label>
        </div>
      </div>
      <div>
        <label class="group-label">Show</label>
        <div class="check-group" style="display:flex;flex-direction:column;gap:2px">
          <label style="font-size:14px;cursor:pointer"><input type="checkbox" id="matchup-show-center" checked> Pred center</label>
          <label style="font-size:14px;cursor:pointer"><input type="checkbox" id="matchup-show-delta" checked> Δ arrows</label>
          <label style="font-size:14px;cursor:pointer"><input type="checkbox" id="matchup-show-games"> Game dots</label>
        </div>
      </div>
      <div>
        <label class="group-label">Categories</label>
        <div class="check-group" id="matchup-categories" style="display:inline-flex;flex-wrap:wrap;gap:4px 12px"></div>
      </div>
    </div>
    <div id="matchup-score-line" style="font-family:monospace;font-size:13px;color:#444;margin-bottom:6px;min-height:18px"></div>
    <div id="matchup-chart"></div>
    <div id="matchup-table" style="margin-top:8px;overflow-x:auto"></div>
  </div>

  <!-- ============ GAME LOG TAB ============ -->
  <div id="tab-gamelog" class="tab-panel">
    <div class="rate-controls">
      <div>
        <label class="group-label">Team</label>
        <select id="gamelog-team" style="height:36px;border-radius:4px;border:1px solid #ccc;padding:0 8px;font-size:14px;width:80px"></select>
      </div>
      <div>
        <label class="group-label">Side</label>
        <div class="radio-group">
          <label><input type="radio" name="gamelog-side" value="off" checked> Offense</label>
          <label><input type="radio" name="gamelog-side" value="def"> Defense</label>
          <label><input type="radio" name="gamelog-side" value="both"> Both</label>
        </div>
      </div>
      <div>
        <label class="group-label">Ellipse</label>
        <div class="radio-group">
          <label><input type="radio" name="gamelog-pct" value="0"> Off</label>
          <label><input type="radio" name="gamelog-pct" value="0.50"> 50%</label>
          <label><input type="radio" name="gamelog-pct" value="0.68" checked> 68%</label>
          <label><input type="radio" name="gamelog-pct" value="0.95"> 95%</label>
        </div>
      </div>
      <div>
        <label class="group-label">Show</label>
        <label style="font-size:14px;cursor:pointer"><input type="checkbox" id="gamelog-show-games" checked> Individual games</label>
      </div>
      <div>
        <label class="group-label">Categories</label>
        <div class="check-group" id="gamelog-categories" style="display:inline-flex;flex-wrap:wrap;gap:4px 12px"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <select id="gamelog-game-select" style="height:32px;border-radius:4px;border:1px solid #ccc;padding:0 8px;font-size:13px;width:300px;font-family:monospace">
        <option value="">Select or click a game…</option>
      </select>
      <span id="gamelog-pinned-label" style="font-size:13px;color:#666;font-style:italic"></span>
    </div>
    <div id="gamelog-chart"></div>
  </div>
</div>

<script>
/* ===================================================================
   DATA & STATE
   =================================================================== */
let seasonData  = [];
let playerData  = [];
let ellipseData = null;
let gameLogData = null;

const SEASON_EXCLUDE = new Set([
  'team_abbr','team_name','games','home_games','away_games',
  'game_id','game_date','is_home',
]);
const PLAYER_EXCLUDE = new Set([
  'player_id','player_name','games','game_id','game_date',
  'height_inches','team_abbr',
  'close_fg','mid_fg','three_fg','ft_fg',
]);

/* ===================================================================
   CATEGORY DEFINITIONS (Rate vs Efficiency)
   =================================================================== */
const SHOT_CATEGORIES = [
  {label:'Close (\u22645ft)', rate:'close_freq', eff:'close_pps', eff_num:null, eff_den:null, color:'green',  symbol:'circle',      is_scoring:true, pct_divisor:2},
  {label:'Mid-Range',         rate:'mid_freq',   eff:'mid_pps',   eff_num:null, eff_den:null, color:'blue',   symbol:'square',      is_scoring:true, pct_divisor:2},
  {label:'3-Pointer',         rate:'three_freq', eff:'three_pps', eff_num:null, eff_den:null, color:'red',    symbol:'triangle-up', is_scoring:true, pct_divisor:3},
  {label:'FT Trip',           rate:'ft_trip_freq',eff:'ft_ppt',   eff_num:null, eff_den:null, color:'purple', symbol:'diamond',     is_scoring:true, pct_divisor:2},
];
const EXTRA_CATEGORIES = [
  {label:'Steals', rate:'stl_per100', eff:null, eff_num:'stl_pts', eff_den:'stl', color:'orange', symbol:'star'},
  {label:'Turnovers', rate:'tov_per100', eff:null, eff_num:'tov_pts', eff_den:'tov', color:'brown', symbol:'pentagon', lower_is_better:true},
  {label:'Off. Rebounds', rate:'oreb_per100', eff:null, eff_num:'orb_pts', eff_den:'oreb', color:'teal', symbol:'hexagon'},
  {label:'Assists', rate:'ast_per100', eff:null, eff_num:'ast_pts', eff_den:'ast', color:'gold', symbol:'cross'},
  {label:'Blocks', rate:'blk_per100', eff:null, eff_num:null, eff_den:null, color:'gray', symbol:'bowtie'},
  {label:'Fouls', rate:'pf_per100', eff:null, eff_num:'pf_pts', eff_den:'pf', color:'hotpink', symbol:'hourglass', lower_is_better:true},
  {label:'Fast Break', rate:'fb_poss_per100', eff:null, eff_num:'fb_pts', eff_den:'fb_poss', color:'cyan', symbol:'triangle-down'},
  {label:'Chances', rate:'chances_freq', eff:'chances_pps', eff_num:null, eff_den:null, color:'slategray', symbol:'asterisk'},
  {label:'Clutch', rate:'clutch_poss_per100', eff:null, eff_num:'clutch_pts', eff_den:'clutch_poss', color:'darkred', symbol:'triangle-left'},
];
const ALL_CATEGORIES = SHOT_CATEGORIES.concat(EXTRA_CATEGORIES);
const CAT_BY_LABEL = {};
ALL_CATEGORIES.forEach(c => CAT_BY_LABEL[c.label] = c);

// Empirical offense weights — joint OLS constraining same w for rate & efficiency
// (2025-26 season, n=1149 games). 1.0 = pure offense, 0.0 = pure defense.
const RATE_WEIGHTS = {
  'close_freq':        0.553,  // Close: offense 55%, defense 45%
  'mid_freq':          0.767,  // Mid:   offense 77%, defense 23%
  'three_freq':        0.753,  // 3pt:   offense 75%, defense 25%
  'ft_trip_freq':      0.676,  // FT:    offense 68%, defense 32%
  'stl_per100':        0.503,  // STL:   ~even
  'tov_per100':        0.432,  // TOV:   defense 57% (defense-dominant)
  'oreb_per100':       0.703,  // OREB:  offense 70%, defense 30%
  'fb_poss_per100':    0.566,  // FB:    offense 57%, defense 43%
};
function rateWeight(rateCol) { return RATE_WEIGHTS[rateCol] ?? 0.5; }

/* ===================================================================
   HELPERS
   =================================================================== */
function isNumeric(val) {
  return typeof val === 'number' && isFinite(val);
}

function getNumericCols(data, exclude) {
  if (!data.length) return [];
  const cols = [];
  for (const key of Object.keys(data[0])) {
    if (exclude.has(key)) continue;
    // Check if the column has string-like FG display values (e.g. "12-34")
    if (typeof data[0][key] === 'string') continue;
    if (data.some(r => isNumeric(r[key]))) cols.push(key);
  }
  return cols.sort();
}

function friendlySeason(col) {
  let label = col.replace(/_/g, ' ').replace(/pct/g, '%').replace(/per100/g, '/100');
  if (label.startsWith('opp ')) label = 'Opp ' + label.slice(4);
  return label.replace(/\b\w/g, c => c.toUpperCase());
}

function friendlyPlayer(col) {
  let label = col.replace(/_/g, ' ').replace(/pct/g, '%').replace(/per100/g, '/100').replace(/per game/g, '/G');
  return label.replace(/\b\w/g, c => c.toUpperCase());
}

function col(data, key) { return data.map(r => r[key]); }
function mean(arr) {
  const valid = arr.filter(isNumeric);
  return valid.length ? valid.reduce((a,b) => a+b, 0) / valid.length : 0;
}

function populateSelect(sel, cols, friendlyFn) {
  sel.innerHTML = '';
  cols.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = friendlyFn(c);
    sel.appendChild(opt);
  });
}

/* ===================================================================
   TAB SWITCHING
   =================================================================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    // Resize charts that rendered while hidden (Plotly measures 0 width on display:none)
    const resizeIds = {gamelog: 'gamelog-chart', matchup: 'matchup-chart'};
    const cid = resizeIds[btn.dataset.tab];
    if (cid) requestAnimationFrame(() => Plotly.relayout(cid, {autosize: true}));
  });
});

/* ===================================================================
   SEASON EXPLORER
   =================================================================== */
function updateSeasonChart() {
  const xCol = document.getElementById('season-x').value;
  const yCol = document.getElementById('season-y').value;
  if (!xCol || !yCol) return;

  const x = col(seasonData, xCol);
  const y = col(seasonData, yCol);
  const labels = col(seasonData, 'team_abbr');
  const xMean = mean(x);
  const yMean = mean(y);

  const traces = [
    // Top histogram (row1, col1) -> xaxis/yaxis
    {
      x: x, type: 'histogram', nbinsx: 12,
      marker: {color:'rgba(44,120,180,0.5)', line:{color:'rgba(44,120,180,0.8)', width:1}},
      showlegend: false, xaxis: 'x', yaxis: 'y',
    },
    // Right histogram (row2, col2) -> xaxis4/yaxis4
    {
      y: y, type: 'histogram', nbinsx: 12,
      marker: {color:'rgba(44,120,180,0.5)', line:{color:'rgba(44,120,180,0.8)', width:1}},
      showlegend: false, xaxis: 'x4', yaxis: 'y4',
    },
    // Main scatter (row2, col1) -> xaxis2/yaxis3
    {
      x: x, y: y, mode: 'markers+text', type: 'scatter',
      text: labels, textposition: 'top center',
      textfont: {size: 10, color: '#444'},
      marker: {size: 9, color: 'rgba(44,120,180,0.75)', line:{width:1, color:'white'}},
      hovertemplate: '<b>%{text}</b><br>' + friendlySeason(xCol) + ': %{x:.2f}<br>' + friendlySeason(yCol) + ': %{y:.2f}<extra></extra>',
      showlegend: false, xaxis: 'x2', yaxis: 'y3',
    },
  ];

  const layout = {
    height: 700, width: 900,
    plot_bgcolor: 'white', paper_bgcolor: '#fafafa',
    margin: {l:60, r:20, t:30, b:60}, bargap: 0.06,
    // Grid: 2x2 with shared axes
    xaxis:  {domain: [0, 0.82], showticklabels: false, showgrid: false, matches: 'x2'},
    yaxis:  {domain: [0.82, 1], showticklabels: false, showgrid: false},
    xaxis2: {domain: [0, 0.82], anchor: 'y3', title: {text: friendlySeason(xCol), font:{size:13}}, showgrid: true, gridcolor:'#eee', zeroline: false},
    yaxis3: {domain: [0, 0.82], anchor: 'x2', title: {text: friendlySeason(yCol), font:{size:13}}, showgrid: true, gridcolor:'#eee', zeroline: false},
    xaxis4: {domain: [0.84, 1], anchor: 'y4', showticklabels: false, showgrid: false},
    yaxis4: {domain: [0, 0.82], showticklabels: false, showgrid: false, matches: 'y3'},
    // Invisible top-right cell
    xaxis3: {domain: [0.84, 1], visible: false},
    yaxis2: {domain: [0.82, 1], visible: false},
    shapes: [
      {type:'line', xref:'x2', yref:'y3', x0: xMean, x1: xMean, y0: 0, y1: 1, yref:'y3 domain', line:{dash:'dot', color:'#bbb', width:1}},
      {type:'line', xref:'x2', yref:'y3', x0: 0, x1: 1, xref:'x2 domain', y0: yMean, y1: yMean, line:{dash:'dot', color:'#bbb', width:1}},
    ],
  };

  Plotly.react('season-chart', traces, layout, {displayModeBar: false});
}

/* ===================================================================
   PLAYER EXPLORER
   =================================================================== */
function updatePlayerChart() {
  const xCol = document.getElementById('player-x').value;
  const yCol = document.getElementById('player-y').value;
  const team = document.getElementById('player-team').value;
  let minPoss = parseInt(document.getElementById('player-min-poss').value, 10);
  if (isNaN(minPoss) || minPoss < 0) minPoss = 0;

  const dfAll = playerData.filter(r => r.poss_played >= minPoss);
  const xLeague = col(dfAll, xCol).filter(isNumeric);
  const yLeague = col(dfAll, yCol).filter(isNumeric);
  const xLeagueMean = mean(xLeague);
  const yLeagueMean = mean(yLeague);

  // League-wide ranges with 5% padding
  const xMin = Math.min(...xLeague), xMax = Math.max(...xLeague);
  const yMin = Math.min(...yLeague), yMax = Math.max(...yLeague);
  const xPad = (xMax - xMin) * 0.05;
  const yPad = (yMax - yMin) * 0.05;
  const xRange = [xMin - xPad, xMax + xPad];
  const yRange = [yMin - yPad, yMax + yPad];

  // League-wide trendline
  let leagueTrend = null;
  const pairs = dfAll.filter(r => isNumeric(r[xCol]) && isNumeric(r[yCol]));
  if (pairs.length >= 2) {
    const xs = col(pairs, xCol), ys = col(pairs, yCol);
    const n = xs.length;
    const sx = xs.reduce((a,b)=>a+b,0), sy = ys.reduce((a,b)=>a+b,0);
    const sxx = xs.reduce((a,b)=>a+b*b,0), sxy = xs.reduce((a,v,i)=>a+v*ys[i],0);
    const m = (n*sxy - sx*sy) / (n*sxx - sx*sx);
    const b = (sy - m*sx) / n;
    const yHat = xs.map(v => m*v + b);
    const ssRes = ys.reduce((a,v,i)=>a+(v-yHat[i])**2,0);
    const yMeanL = sy/n;
    const ssTot = ys.reduce((a,v)=>a+(v-yMeanL)**2,0);
    const r2 = ssTot > 0 ? 1 - ssRes/ssTot : 0;
    leagueTrend = {m, b, r2, xMin: Math.min(...xs), xMax: Math.max(...xs), yMax: Math.max(...ys)};
  }

  // Filter by team
  const df = team === 'ALL' ? dfAll : dfAll.filter(r => r.team_abbr === team);
  const x = col(df, xCol);
  const y = col(df, yCol);
  const labels = col(df, 'player_name');
  const showText = team !== 'ALL';

  const traces = [
    // Top histogram - league-wide
    {
      x: xLeague, type:'histogram', nbinsx:20,
      marker:{color:'rgba(44,120,180,0.5)', line:{color:'rgba(44,120,180,0.8)', width:1}},
      showlegend:false, xaxis:'x', yaxis:'y',
    },
    // Right histogram - league-wide
    {
      y: yLeague, type:'histogram', nbinsx:20,
      marker:{color:'rgba(44,120,180,0.5)', line:{color:'rgba(44,120,180,0.8)', width:1}},
      showlegend:false, xaxis:'x4', yaxis:'y4',
    },
    // Main scatter - filtered
    {
      x: x, y: y, type:'scatter',
      mode: showText ? 'markers+text' : 'markers',
      text: labels,
      textposition: showText ? 'top center' : undefined,
      textfont: showText ? {size:9, color:'#444'} : undefined,
      marker:{size:7, color:'rgba(44,120,180,0.6)', line:{width:0.5, color:'white'}},
      hovertemplate: '<b>%{text}</b><br>' + friendlyPlayer(xCol) + ': %{x:.2f}<br>' + friendlyPlayer(yCol) + ': %{y:.2f}<extra></extra>',
      showlegend:false, xaxis:'x2', yaxis:'y3',
    },
  ];

  // Add trendline
  if (leagueTrend) {
    const {m, b, r2} = leagueTrend;

/* ===================================================================
   RATE VS EFFICIENCY EXPLORER
   =================================================================== */
/* Build pts/100 contour traces (hyperbolas where rate*eff = k) */
function buildContourTraces(allX, allY) {
  const traces = [];
  const annotations = [];
  const xVals = allX.filter(isNumeric), yVals = allY.filter(isNumeric);
  if (!xVals.length || !yVals.length) return {traces, annotations};
  const xMin = Math.min(...xVals), xMax = Math.max(...xVals);
  const yMin = Math.min(...yVals), yMax = Math.max(...yVals);
  const xPad = (xMax - xMin) * 0.15, yPad = (yMax - yMin) * 0.15;
  const xLo = Math.max(0.5, xMin - xPad), xHi = xMax + xPad;
  const yLo = Math.max(0.01, yMin - yPad), yHi = yMax + yPad;
  const p100Min = xLo * yLo, p100Max = xHi * yHi;
  const step = 5;
  const loLevel = Math.ceil(p100Min / step) * step;
  const hiLevel = Math.floor(p100Max / step) * step;
  const nPts = 200;
  const xCurve = Array.from({length: nPts}, (_, i) => xLo + i * (xHi - xLo) / (nPts - 1));
  for (let k = loLevel; k <= hiLevel + 0.1; k += step) {
    const xc = [], yc = [];
    let lastIdx = -1;
    for (let i = 0; i < nPts; i++) {
      const yv = k / xCurve[i];
      if (yv >= yLo && yv <= yHi) { xc.push(xCurve[i]); yc.push(yv); lastIdx = xc.length - 1; }
    }
    if (!xc.length) continue;
    traces.push({
      x: xc, y: yc, mode: 'lines', type: 'scatter',
      line: {color: 'rgba(180,180,180,0.4)', width: 1},
      showlegend: false, hoverinfo: 'skip',
    });
    // Label on right edge
    annotations.push({
      x: xc[lastIdx], y: yc[lastIdx],
      text: String(k), showarrow: false,
      font: {size: 9, color: 'rgba(150,150,150,0.7)'},
      xshift: 12, yshift: 0,
    });
    // Label on left edge
    annotations.push({
      x: xc[0], y: yc[0],
      text: String(k), showarrow: false,
      font: {size: 9, color: 'rgba(150,150,150,0.7)'},
      xshift: -12, yshift: 0,
    });
  }
  return {traces, annotations};
}

function getRateCol(cat, prefix) { return prefix + cat.rate; }

function getEffValues(data, cat, prefix) {
  if (cat.eff !== null) {
    const c = prefix + cat.eff;
    return data.map(r => r[c]);
  }
  if (cat.eff_num === null) return null;
  const numCol = prefix + cat.eff_num;
  const denCol = prefix + cat.eff_den;
  return data.map(r => {
    const d = r[denCol];
    if (!d || d === 0) return null;
    return r[numCol] / d;
  });
}

function buildUnfaceted(data, categories, prefixes, showAvg, connectDots) {
  const isBoth = prefixes.length === 2;
  let titleSide;
  if (isBoth) titleSide = 'Offense & Defense';
  else titleSide = prefixes[0] === 'opp_' ? 'Opponent' : 'Team';

  // Collect all rate/eff for contour lines
  const allRates = [], allEffs = [];
  prefixes.forEach(prefix => {
    categories.forEach(cat => {
      const rateCol = getRateCol(cat, prefix);
      const effVals = getEffValues(data, cat, prefix);
      if (!effVals) return;
      data.forEach((r, i) => {
        if (isNumeric(r[rateCol]) && isNumeric(effVals[i])) {
          allRates.push(r[rateCol]); allEffs.push(effVals[i]);
        }
      });
    });
  });
  const contour = buildContourTraces(allRates, allEffs);
  const traces = contour.traces.slice();

  // For connect-dots: collect per-team per-category points across prefixes
  // Key: "team|catLabel" -> {off: {x,y}, opp: {x,y}}
  const pairMap = {};

  prefixes.forEach(prefix => {
    const sideLabel = prefix === 'opp_' ? 'Opponent' : 'Team';
    const pairKey = prefix === 'opp_' ? 'opp' : 'off';

    categories.forEach(cat => {
      const rateCol = getRateCol(cat, prefix);
      const effVals = getEffValues(data, cat, prefix);
      if (!effVals) return;
      const x = [], y = [], text = [], pts100 = [];
      data.forEach((r, i) => {
        if (isNumeric(r[rateCol]) && isNumeric(effVals[i])) {
          x.push(r[rateCol]); y.push(effVals[i]); text.push(r.team_abbr);
          pts100.push(r[rateCol] * effVals[i]);
          if (isBoth && connectDots) {
            const k = r.team_abbr + '|' + cat.label;
            if (!pairMap[k]) pairMap[k] = {};
            pairMap[k][pairKey] = {x: r[rateCol], y: effVals[i]};
          }
        }
      });
      const nTeams = x.length;
      const isOpp = prefix === 'opp_';
      const higherIsBetter = (isOpp === !!cat.lower_is_better);
      const rankOf = (vals, hib) => {
        const idx = vals.map((v, i) => [v, i]);
        idx.sort((a, b) => hib ? b[0] - a[0] : a[0] - b[0]);
        const r = new Array(vals.length);
        idx.forEach(([, j], ri) => { r[j] = ri + 1; });
        return r;
      };
      const rRanks = rankOf(x, higherIsBetter);
      const eRanks = rankOf(y, higherIsBetter);
      const pRanks = rankOf(pts100, higherIsBetter);
      const customdata = x.map((_, i) => {
        const cd = [pts100[i], rRanks[i], eRanks[i], pRanks[i], nTeams];
        if (cat.is_scoring) cd.push(y[i] / cat.pct_divisor);
        return cd;
      });
      const name = isBoth ? cat.label + ' (' + sideLabel + ')' : cat.label;
      const markerOpts = {symbol: cat.symbol, size: 12, color: cat.color, line:{width:1, color:'black'}};
      if (prefix === 'opp_') {
        markerOpts.color = 'white';
        markerOpts.line = {width: 2, color: cat.color};
      }
      const effPct = cat.is_scoring ? ' (%{customdata[5]:.1%})' : '';
      traces.push({
        x, y, text, customdata, type:'scatter', mode:'markers+text', name: name,
        textposition:'top center', textfont:{size:8},
        marker: markerOpts,
        hovertemplate: '<b>%{text}</b><br>' + name + '<br>Rate: %{x:.1f}/100 [#%{customdata[1]}/%{customdata[4]}]<br>Efficiency: %{y:.2f}' + effPct + ' [#%{customdata[2]}/%{customdata[4]}]<br>Pts/100: %{customdata[0]:.1f} [#%{customdata[3]}/%{customdata[4]}]<extra></extra>',
        legendgroup: isBoth ? cat.label + '_' + prefix : cat.label,
      });

      if (showAvg && x.length) {
        const avgX = mean(x), avgY = mean(y);
        const xMin = Math.min(...x), xMax = Math.max(...x);
        const yMin = Math.min(...y), yMax = Math.max(...y);
        const grp = isBoth ? cat.label + '_' + prefix : cat.label;
        traces.push(
          {x:[avgX,avgX], y:[yMin,yMax], mode:'lines', type:'scatter',
           line:{dash:'dot', color:cat.color, width:1.5}, opacity:0.5,
           showlegend:false, hoverinfo:'skip', legendgroup:grp},
          {x:[xMin,xMax], y:[avgY,avgY], mode:'lines', type:'scatter',
           line:{dash:'dot', color:cat.color, width:1.5}, opacity:0.5,
           showlegend:false, hoverinfo:'skip', legendgroup:grp},
        );
      }
    });
  });

  // Draw connecting lines between team/opponent pairs
  if (isBoth && connectDots) {
    // Group by category for consistent coloring
    const catLines = {};
    for (const [k, pts] of Object.entries(pairMap)) {
      if (!pts.off || !pts.opp) continue;
      const catLabel = k.split('|')[1];
      if (!catLines[catLabel]) catLines[catLabel] = {x:[], y:[]};
      catLines[catLabel].x.push(pts.off.x, pts.opp.x, null);
      catLines[catLabel].y.push(pts.off.y, pts.opp.y, null);
    }
    for (const [catLabel, coords] of Object.entries(catLines)) {
      const cat = CAT_BY_LABEL[catLabel];
      traces.push({
        x: coords.x, y: coords.y, type:'scatter', mode:'lines',
        line:{color: cat.color, width:1, dash:'solid'},
        opacity: 0.4, showlegend:false, hoverinfo:'skip',
      });
    }
  }

  const layout = {
    title: 'Rate vs Efficiency (' + titleSide + ')',
    xaxis: {title:'Per 100 Possessions', showgrid:true, gridcolor:'lightgray', gridwidth:1},
    yaxis: {title:'Points Per Event', showgrid:true, gridcolor:'lightgray', gridwidth:1},
    height:700, width:1100, showlegend:true,
    legend:{yanchor:'top', y:0.99, xanchor:'left', x:1.02},
    margin:{l:60, r:160, t:40, b:60},
    plot_bgcolor:'white', paper_bgcolor:'#fafafa',
    annotations: contour.annotations,
  };
  Plotly.react('rate-chart', traces, layout, {displayModeBar: false});
}

/* ===================================================================
   ELLIPSE PREDICTOR — shared constants + helpers
   =================================================================== */
const ELLIPSE_CATEGORIES = [
  {label:'Close (\u22645ft)', rate:'close_freq',    eff:'close_pps',    pct_divisor:2, color:'green',    symbol:'circle',        is_scoring:true},
  {label:'Mid-Range',         rate:'mid_freq',       eff:'mid_pps',      pct_divisor:2, color:'blue',     symbol:'square',        is_scoring:true},
  {label:'3-Pointer',         rate:'three_freq',     eff:'three_pps',    pct_divisor:3, color:'red',      symbol:'triangle-up',   is_scoring:true},
  {label:'FT Trip',           rate:'ft_trip_freq',   eff:'ft_ppt',       pct_divisor:2, color:'purple',   symbol:'diamond',       is_scoring:true},
  {label:'Steals',            rate:'stl_per100',     eff:'stl_ppe',                     color:'orange',   symbol:'star',          is_scoring:false},
  {label:'Turnovers',         rate:'tov_per100',     eff:'tov_ppe',                     color:'brown',    symbol:'pentagon',      is_scoring:false, lower_is_better:true},
  {label:'Off. Rebounds',     rate:'oreb_per100',    eff:'orb_ppe',                     color:'teal',     symbol:'hexagon',       is_scoring:false},
  {label:'Assists',           rate:'ast_per100',     eff:'ast_ppe',                     color:'goldenrod',symbol:'cross',         is_scoring:false},
  {label:'Fouls',             rate:'pf_per100',      eff:'pf_ppe',                      color:'hotpink',  symbol:'hourglass',     is_scoring:false, lower_is_better:true},
  {label:'Fast Break',        rate:'fb_poss_per100', eff:'fb_ppe',                      color:'cyan',     symbol:'triangle-down', is_scoring:false},
  {label:'Chances',           rate:'chances_freq',   eff:'chances_pps',                 color:'slategray',symbol:'asterisk',      is_scoring:false},
];
const ELLIPSE_CAT_BY_LABEL = {};
ELLIPSE_CATEGORIES.forEach(c => ELLIPSE_CAT_BY_LABEL[c.label] = c);
const ELLIPSE_DEFAULT        = new Set(['Close (\u22645ft)', 'Mid-Range', '3-Pointer']);
const ELLIPSE_LOWER_IS_BETTER = new Set(['Turnovers', 'Fouls']);
const ELLIPSE_SHORT = {
  'Close (\u22645ft)':'Close','Mid-Range':'Mid','3-Pointer':'3PT','FT Trip':'FT',
  'Steals':'STL','Turnovers':'TOV','Off. Rebounds':'OREB',
  'Assists':'AST','Fouls':'PF','Fast Break':'FB','Chances':'Chances',
};
let ellipseModelMap = {};

function ellipsePredictCenter(offTeam, defTeam, isHome, cat) {
  const model = ellipseModelMap[cat.rate + '+' + cat.eff];
  if (!model || !ellipseData) return null;
  const off = ellipseData.off_avgs[offTeam];
  const def = ellipseData.def_avgs[defTeam];
  if (!off || !def) return null;
  const fv = [1, off[cat.rate], off[cat.eff], def[cat.rate], def[cat.eff], isHome];
  if (fv.some(v => !isNumeric(v))) return null;
  const predR = fv.reduce((s, v, i) => s + v * model.coef[i][0], 0);
  const predE = fv.reduce((s, v, i) => s + v * model.coef[i][1], 0);
  return [predR, predE];
}

function ellipseXY(center, eigenvals, eigenvecs, scale) {
  const n = 121, x = [], y = [];
  const sq0 = Math.sqrt(scale * eigenvals[0]);
  const sq1 = Math.sqrt(scale * eigenvals[1]);
  for (let i = 0; i < n; i++) {
    const t = 2 * Math.PI * i / (n - 1);
    const c = Math.cos(t), s = Math.sin(t);
    x.push(center[0] + eigenvecs[0][0]*sq0*c + eigenvecs[0][1]*sq1*s);
    y.push(center[1] + eigenvecs[1][0]*sq0*c + eigenvecs[1][1]*sq1*s);
  }
  return {x, y};
}

function normCDF(z) {
  const sign = z < 0 ? -1 : 1;
  const x = Math.abs(z) / Math.SQRT2;          // erf argument = |z|/√2
  const t = 1 / (1 + 0.3275911 * x);
  const p = 1 - (((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return 0.5 * (1 + sign * p);
}

function ellipseWinProbAway(awayTeam, homeTeam) {
  let meanDiff = 0, totalVar = 0;
  ELLIPSE_CATEGORIES.filter(c => c.is_scoring).forEach(cat => {
    const model = ellipseModelMap[cat.rate + '+' + cat.eff];
    if (!model) return;
    const ca = ellipsePredictCenter(awayTeam, homeTeam, 0, cat);
    const ch = ellipsePredictCenter(homeTeam, awayTeam, 1, cat);
    if (!ca || !ch) return;
    const ev = model.eigenvals, evec = model.eigenvecs;
    const cov00 = ev[0]*evec[0][0]*evec[0][0] + ev[1]*evec[0][1]*evec[0][1];
    const cov11 = ev[0]*evec[1][0]*evec[1][0] + ev[1]*evec[1][1]*evec[1][1];
    const cov01 = ev[0]*evec[0][0]*evec[1][0] + ev[1]*evec[0][1]*evec[1][1];
    const tv = c => c[1]*c[1]*cov00 + c[0]*c[0]*cov11 + 2*c[0]*c[1]*cov01;
    meanDiff += ca[0]*ca[1] - ch[0]*ch[1];
    totalVar += tv(ca) + tv(ch);
  });
  if (totalVar < 1e-9) return 0.5;
  return normCDF(meanDiff / Math.sqrt(totalVar));
}

function ellipseAdvLine(catLabel, pa, pb, awayTeam, homeTeam) {
  const short  = ELLIPSE_SHORT[catLabel] || catLabel;
  const padded = short.padStart(6).replace(/ /g, '\u00a0');
  const diff   = pa - pb;
  if (Math.abs(diff) < 0.05) return padded + ': even (' + Math.abs(diff).toFixed(1) + ')';
  const winner = ELLIPSE_LOWER_IS_BETTER.has(catLabel)
    ? (diff > 0 ? homeTeam : awayTeam)
    : (diff > 0 ? awayTeam : homeTeam);
  return padded + ': <b>' + winner + '</b> +' + Math.abs(diff).toFixed(1);
}

const CAT_RGB = {
  green:'0,128,0', blue:'0,0,255', red:'255,0,0', purple:'128,0,128',
  orange:'255,165,0', brown:'165,42,42', teal:'0,128,128',
  goldenrod:'218,165,32', hotpink:'255,105,180', cyan:'0,255,255',
  slategray:'112,128,144',
};
function catRgba(color, alpha) {
  return 'rgba(' + (CAT_RGB[color] || '100,100,100') + ',' + alpha + ')';
}

/** Simple axis-aligned ellipse used by game-log (Dash app formula). */
function axisEllipseXY(cx, cy, sx, sy, pct) {
  const n = 121, x = [], y = [];
  const nsd = Math.sqrt(-2 * Math.log(1 - pct));
  for (let i = 0; i < n; i++) {
    const t = 2 * Math.PI * i / (n - 1);
    x.push(cx + nsd * sx * Math.cos(t));
    y.push(cy + nsd * sy * Math.sin(t));
  }
  return {x, y};
}

/** Sum scoring-category pts/100 for one attacking team. */
function predPts100(offTeam, defTeam, isHome) {
  let pts = 0;
  for (const cat of ELLIPSE_CATEGORIES) {
    if (!cat.is_scoring) continue;
    const c = ellipsePredictCenter(offTeam, defTeam, isHome, cat);
    if (!c) return null;
    pts += c[0] * c[1];
  }
  return pts;
}

function updateMatchupChart() {
  if (!ellipseData) return;
  const awayTeam  = document.getElementById('matchup-away').value;
  const homeTeam  = document.getElementById('matchup-home').value;
  if (!awayTeam || !homeTeam) return;

  const pctStr    = document.querySelector('input[name="matchup-pct"]:checked').value;
  const avgMode   = document.querySelector('input[name="matchup-avg"]:checked').value;
  const showCenter = document.getElementById('matchup-show-center').checked;
  const showDelta  = document.getElementById('matchup-show-delta').checked;
  const showGames  = document.getElementById('matchup-show-games').checked;
  const showOffGhost = avgMode === 'offense' || avgMode === 'both';
  const showDefGhost = avgMode === 'defense' || avgMode === 'both';

  const checked   = Array.from(document.querySelectorAll('#matchup-categories input:checked')).map(cb => cb.value);
  const activeCats = checked.map(lbl => ELLIPSE_CAT_BY_LABEL[lbl]).filter(Boolean);
  if (!activeCats.length) {
    Plotly.react('matchup-chart', [], {title:'Select at least one category', height:700, plot_bgcolor:'white', paper_bgcolor:'#fafafa'});
    return;
  }

  const traces = [], layoutAnnotations = [], predAway = {}, predHome = {};
  const allX = [], allY = [];
  const Nm = (ellipseData.teams||[]).length || 30;
  // fmtRk: flip when (defense && !lowerIsBetter) || (offense && lowerIsBetter)
  // i.e. shouldFlip = isD XOR lib — ensures best=1 convention for all categories
  const fmtRk = (r, isD, lib) => {
    if (!r) return '';
    const flip = (isD && !lib) || (!isD && !!lib);
    return ' [#'+(flip ? Nm+1-r : r)+'/'+Nm+']';
  };

  // Away attacks Home (hollow/dotted), Home attacks Away (filled/solid)
  const attackers = [
    {off:awayTeam, def:homeTeam, isHome:0, label:awayTeam, hollow:true,  predStore:predAway},
    {off:homeTeam, def:awayTeam, isHome:1, label:homeTeam, hollow:false, predStore:predHome},
  ];

  activeCats.forEach(cat => {
    const model = ellipseModelMap[cat.rate+'+'+cat.eff];
    if (!model) return;
    const lgAvg = ellipseData.league_avgs[cat.label];
    const lgRng = ellipseData.league_ranges[cat.label];

    // League-average crosshairs (shapes are more efficient but annotations work)
    if (lgAvg && lgRng) {
      traces.push({x:[lgAvg.rate,lgAvg.rate], y:[lgRng.emin,lgRng.emax], mode:'lines', type:'scatter', line:{color:cat.color,width:2.5,dash:'dot'}, opacity:0.75, showlegend:false, hoverinfo:'skip'});
      traces.push({x:[lgRng.rmin,lgRng.rmax], y:[lgAvg.eff,lgAvg.eff],   mode:'lines', type:'scatter', line:{color:cat.color,width:2.5,dash:'dot'}, opacity:0.75, showlegend:false, hoverinfo:'skip'});
    }

    attackers.forEach(({off, def, isHome, label, hollow, predStore}) => {
      const center = ellipsePredictCenter(off, def, isHome, cat);
      if (!center) return;
      predStore[cat.label]       = center[0] * center[1];
      predStore[cat.label+'_r']  = center[0].toFixed(1);
      predStore[cat.label+'_e']  = center[1].toFixed(3);
      allX.push(center[0]); allY.push(center[1]);

      // Ellipse
      if (pctStr !== '0') {
        const scale = model.scales[pctStr];
        if (scale !== undefined) {
          const {x, y} = ellipseXY(center, model.eigenvals, model.eigenvecs, scale);
          allX.push(...x); allY.push(...y);
          traces.push({
            x, y, mode:'lines', type:'scatter',
            line:{color:cat.color, width:hollow?1.8:2.5, dash:hollow?'dot':'solid'},
            opacity:hollow?0.55:0.80,
            fill:'toself', fillcolor:hollow?'rgba(0,0,0,0)':catRgba(cat.color,0.04),
            legendgroup:label+'_'+cat.label, showlegend:false, hoverinfo:'skip',
          });
        }
      }

      // Predicted center
      if (showCenter) {
        const oos = model.oos && model.oos[pctStr];
        const oosStr = oos != null ? (oos*100).toFixed(0)+'%' : 'n/a';
        const pred_pts = (center[0]*center[1]).toFixed(1);
        const homeStr = isHome ? 'home' : 'away';
        traces.push({
          x:[center[0]], y:[center[1]], mode:'markers+text', type:'scatter',
          marker:{size:14, symbol:cat.symbol, color:hollow?'white':cat.color,
                  line:{width:2, color:hollow?cat.color:'black'}, opacity:1},
          text:[label], textposition:'top center',
          textfont:{size:9, color:cat.color},
          name:cat.label+' \u2014 '+label,
          legendgroup:label+'_'+cat.label, showlegend:true,
          hovertemplate:'<b>'+label+' attacks ('+homeStr+') \u2014 '+cat.label+'</b><br>'+
            'Predicted: '+center[0].toFixed(1)+'/100  '+center[1].toFixed(3)+' ppe  '+pred_pts+' pts/100<br>'+
            'Ellipse: '+(parseFloat(pctStr)*100)+'%  OOS coverage: '+oosStr+'<extra></extra>',
        });
      }

      // Offensive ghost (season avg for attacker)
      const lib   = !!cat.lower_is_better;
      const offAvg = ellipseData.off_avgs[off];
      if (showOffGhost && offAvg && isNumeric(offAvg[cat.rate]) && isNumeric(offAvg[cat.eff])) {
        const sAvg = [offAvg[cat.rate], offAvg[cat.eff]];
        const dist = Math.hypot(center[0]-sAvg[0], center[1]-sAvg[1]);
        if (dist > 1e-4) {
          const s100 = (sAvg[0]*sAvg[1]).toFixed(1);
          const pctD = cat.pct_divisor;
          const effStr = pctD ? sAvg[1].toFixed(3)+' ('+(sAvg[1]/pctD*100).toFixed(1)+'%)' : sAvg[1].toFixed(3);
          const oRks  = gameLogData ? (gameLogData.off_ranks||{}) : {};
          const oP100 = gameLogData ? (gameLogData.off_p100_ranks||{}) : {};
          const rRkO  = fmtRk((oRks[off]||{})[cat.rate], false, lib);
          const eRkO  = fmtRk((oRks[off]||{})[cat.eff],  false, lib);
          const pRkO  = fmtRk((oP100[cat.rate+'+'+cat.eff]||{})[off], false, lib);
          traces.push({
            x:[sAvg[0]], y:[sAvg[1]], mode:'markers', type:'scatter',
            marker:{size:10, symbol:cat.symbol, color:'white', line:{width:2,color:cat.color}, opacity:0.35},
            legendgroup:label+'_'+cat.label, showlegend:false,
            hovertemplate:'<b>'+off+' Offense avg \u2014 '+cat.label+'</b><br>'+
              'Rate: '+sAvg[0].toFixed(1)+'/100'+rRkO+'<br>Efficiency: '+effStr+eRkO+'<br>Pts/100: '+s100+pRkO+'<extra></extra>',
          });
          if (showDelta) layoutAnnotations.push({
            x:center[0], y:center[1], ax:sAvg[0], ay:sAvg[1],
            xref:'x', yref:'y', axref:'x', ayref:'y',
            showarrow:true, text:'', arrowhead:3, arrowsize:0.9, arrowwidth:1.8,
            arrowcolor:cat.color, opacity:0.8,
          });
        }
      }

      // Defensive ghost (what opponents typically produce against defender)
      const defAvg = ellipseData.def_avgs[def];
      if (showDefGhost && defAvg && isNumeric(defAvg[cat.rate]) && isNumeric(defAvg[cat.eff])) {
        const dAvg = [defAvg[cat.rate], defAvg[cat.eff]];
        const dist = Math.hypot(center[0]-dAvg[0], center[1]-dAvg[1]);
        if (dist > 1e-4) {
          const d100 = (dAvg[0]*dAvg[1]).toFixed(1);
          const pctD = cat.pct_divisor;
          const dEffStr = pctD ? dAvg[1].toFixed(3)+' ('+(dAvg[1]/pctD*100).toFixed(1)+'%)' : dAvg[1].toFixed(3);
          const dRks  = gameLogData ? (gameLogData.def_ranks||{}) : {};
          const dP100 = gameLogData ? (gameLogData.def_p100_ranks||{}) : {};
          const rRkD  = fmtRk((dRks[def]||{})[cat.rate], true, lib);
          const eRkD  = fmtRk((dRks[def]||{})[cat.eff],  true, lib);
          const pRkD  = fmtRk((dP100[cat.rate+'+'+cat.eff]||{})[def], true, lib);
          traces.push({
            x:[dAvg[0]], y:[dAvg[1]], mode:'markers', type:'scatter',
            marker:{size:8, symbol:cat.symbol, color:'white', line:{width:2,color:cat.color}, opacity:0.22},
            legendgroup:label+'_'+cat.label, showlegend:false,
            hovertemplate:'<b>'+def+' Defense avg \u2014 '+cat.label+'</b><br>'+
              'Opp Rate: '+dAvg[0].toFixed(1)+'/100'+rRkD+'<br>Opp Efficiency: '+dEffStr+eRkD+'<br>Opp Pts/100: '+d100+pRkD+'<extra></extra>',
          });
          if (showDelta) layoutAnnotations.push({
            x:center[0], y:center[1], ax:dAvg[0], ay:dAvg[1],
            xref:'x', yref:'y', axref:'x', ayref:'y',
            showarrow:true, text:'', arrowhead:3, arrowsize:0.8, arrowwidth:1.2,
            arrowcolor:cat.color, opacity:0.5,
          });
        }
      }

      // Individual game dots (attacker's own games)
      if (showGames) {
        const gGames = gameLogData ? gameLogData.games.filter(r => r.team === off) : [];
        const gx=[], gy=[], gt=[];
        gGames.forEach(r => {
          if (!isNumeric(r[cat.rate]) || !isNumeric(r[cat.eff])) return;
          gx.push(r[cat.rate]); gy.push(r[cat.eff]);
          gt.push(r.date);
        });
        if (gx.length) traces.push({
          x:gx, y:gy, mode:'markers', type:'scatter',
          marker:{size:7, symbol:cat.symbol, color:hollow?'white':cat.color,
                  line:{width:1, color:cat.color}, opacity:0.45},
          legendgroup:label+'_'+cat.label, showlegend:false,
          text:gt,
          hovertemplate:'<b>'+label+' \u2014 '+cat.label+'</b><br>%{text}<br>Rate: %{x:.1f}/100  Eff: %{y:.3f}<extra></extra>',
        });
      }
    });
  });

  // Always fill scoring-cat predictions (annotation + score header always show all 4)
  ELLIPSE_CATEGORIES.filter(c => c.is_scoring).forEach(cat => {
    if (predAway[cat.label] != null) return;
    attackers.forEach(({off, def, isHome, predStore}) => {
      const center = ellipsePredictCenter(off, def, isHome, cat);
      if (!center) return;
      predStore[cat.label]      = center[0] * center[1];
      predStore[cat.label+'_r'] = center[0].toFixed(1);
      predStore[cat.label+'_e'] = center[1].toFixed(3);
    });
  });

  // Contour lines
  const contour = buildContourTraces(allX, allY);

  // In-chart annotation
  const annLines = ['<b>Pred Pts/100 by Category</b>'];
  let sumAway = 0, sumHome = 0, hasScoring = false;
  ELLIPSE_CATEGORIES.filter(c => c.is_scoring).forEach(cat => {
    const pa = predAway[cat.label], ph = predHome[cat.label];
    if (pa == null || ph == null) return;
    hasScoring = true; sumAway += pa; sumHome += ph;
    annLines.push(ellipseAdvLine(cat.label, pa, ph, awayTeam, homeTeam));
  });
  if (hasScoring) {
    annLines.push('');
    annLines.push('\u00a0\u00a0<b>'+awayTeam+'</b>: '+sumAway.toFixed(1));
    annLines.push('\u00a0\u00a0<b>'+homeTeam+'</b>: '+sumHome.toFixed(1));
    const diff = sumAway - sumHome;
    if (Math.abs(diff) >= 0.05)
      annLines.push('\u00a0\u00a0Edge: <b>'+(diff>0?awayTeam:homeTeam)+'</b> +'+Math.abs(diff).toFixed(1));
    const wp = ellipseWinProbAway(awayTeam, homeTeam);
    const fav = wp >= 0.5 ? awayTeam : homeTeam;
    annLines.push('\u00a0\u00a0Prob: <b>'+fav+'</b> '+Math.round((wp>=0.5?wp:1-wp)*100)+'%');
  }
  const nonScoring = activeCats.filter(c => !c.is_scoring)
    .filter(c => predAway[c.label] != null && predHome[c.label] != null);
  if (nonScoring.length) {
    annLines.push('');
    nonScoring.forEach(cat => annLines.push(ellipseAdvLine(cat.label, predAway[cat.label], predHome[cat.label], awayTeam, homeTeam)));
  }
  layoutAnnotations.push({
    text:annLines.join('<br>'), xref:'paper', yref:'paper', x:0.98, y:0.98,
    xanchor:'right', yanchor:'top', showarrow:false,
    font:{size:11, family:'monospace'}, align:'left',
    bgcolor:'rgba(255,255,255,0.85)', bordercolor:'#ccc', borderwidth:1, borderpad:6,
  });

  const pctNum = parseFloat(pctStr) * 100;
  const titleNote = ' solid='+homeTeam+' \u00b7 dotted='+awayTeam+' \u00b7 '+(pctNum||'no')+' ellipse';
  Plotly.react('matchup-chart', contour.traces.concat(traces), {
    title:{text:awayTeam+' @ '+homeTeam+' \u2014 Matchup-Adjusted Predictive Ellipses'
      +'<span style="font-size:11px;color:gray"> '+titleNote+'</span>',
      font:{size:14}},
    xaxis:{title:'Rate per 100 possessions', showgrid:true, gridcolor:'lightgray', zeroline:false},
    yaxis:{title:'Points per event', showgrid:true, gridcolor:'lightgray', zeroline:false},
    height:700, showlegend:true,
    legend:{orientation:'h', yanchor:'top', y:-0.12, xanchor:'center', x:0.5},
    margin:{l:60, r:60, t:70, b:120},
    plot_bgcolor:'white', paper_bgcolor:'#fafafa',
    annotations:layoutAnnotations.concat(contour.annotations),
  }, {displayModeBar:false});

  // Score/pace header
  const awayPts100 = predPts100(awayTeam, homeTeam, 0);
  const homePts100 = predPts100(homeTeam, awayTeam, 1);
  const scoreEl = document.getElementById('matchup-score-line');
  if (awayPts100 != null && homePts100 != null && gameLogData) {
    const pace = team => {
      const gs = gameLogData.games.filter(r => r.team === team && r.poss > 0);
      return gs.length ? gs.reduce((s,r) => s+r.poss, 0) / gs.length : 97;
    };
    const avgPace = (pace(awayTeam) + pace(homeTeam)) / 2;
    const awayGame = awayPts100 * avgPace / 100;
    const homeGame = homePts100 * avgPace / 100;
    const wp = ellipseWinProbAway(awayTeam, homeTeam);
    const fav = wp >= 0.5 ? awayTeam : homeTeam;
    scoreEl.innerHTML = awayTeam+'&nbsp;&nbsp;'+awayGame.toFixed(1)+'&nbsp;&nbsp;\u2014&nbsp;&nbsp;'+homeGame.toFixed(1)+'&nbsp;&nbsp;'+homeTeam
      +'&nbsp;&nbsp;&nbsp;(pts/100:&nbsp;'+awayPts100.toFixed(1)+' vs '+homePts100.toFixed(1)
      +' &nbsp;\u00b7&nbsp; ~'+avgPace.toFixed(0)+' poss/game)'
      +'&nbsp;&nbsp;&nbsp;\u00b7&nbsp;&nbsp;&nbsp;<b>'+fav+'</b>&nbsp;win prob&nbsp;'+Math.round((wp>=0.5?wp:1-wp)*100)+'%';
  } else {
    scoreEl.textContent = '';
  }

  // Data table
  const tableEl = document.getElementById('matchup-table');
  const thresh = parseFloat(pctStr);
  const tableRows = [];
  activeCats.forEach(cat => {
    const pa = predAway[cat.label], ph = predHome[cat.label];
    if (pa == null && ph == null) return;
    const model = ellipseModelMap[cat.rate+'+'+cat.eff];
    const oos = model && model.oos && model.oos[pctStr];
    const oosStr = oos != null ? (oos*100).toFixed(0)+'%' : '\u2014';
    const adv = (pa != null && ph != null) ? pa - ph : null;
    const advStr = adv != null ? (adv>=0?'+':'')+adv.toFixed(1) : '\u2014';
    const advColor = adv==null?'#555':adv>0.3?'green':adv<-0.3?'red':'#555';
    const oosDelta = oos != null ? oos - thresh : null;
    const oosColor = oosDelta==null?'#555':oosDelta>=-0.05?'green':oosDelta>=-0.15?'darkorange':'red';
    tableRows.push('<tr>'
      +'<td style="padding:3px 10px;font-weight:bold;color:'+cat.color+'">'+cat.label+'</td>'
      +'<td style="padding:3px 10px;text-align:right">'+(pa!=null?(predAway[cat.label+'_r']||'\u2014'):'\u2014')+'</td>'
      +'<td style="padding:3px 10px;text-align:right">'+(pa!=null?(predAway[cat.label+'_e']||'\u2014'):'\u2014')+'</td>'
      +'<td style="padding:3px 10px;text-align:right">'+(pa!=null?pa.toFixed(1):'\u2014')+'</td>'
      +'<td style="padding:3px 10px;text-align:right">'+(ph!=null?(predHome[cat.label+'_r']||'\u2014'):'\u2014')+'</td>'
      +'<td style="padding:3px 10px;text-align:right">'+(ph!=null?(predHome[cat.label+'_e']||'\u2014'):'\u2014')+'</td>'
      +'<td style="padding:3px 10px;text-align:right">'+(ph!=null?ph.toFixed(1):'\u2014')+'</td>'
      +'<td style="padding:3px 10px;text-align:right;color:'+advColor+';font-weight:'+(adv!=null&&Math.abs(adv)>0.5?'bold':'normal')+'">'+advStr+'</td>'
      +'<td style="padding:3px 10px;text-align:right;color:'+oosColor+'">'+oosStr+'</td>'
      +'</tr>');
  });
  if (tableRows.length) {
    const pctLbl = thresh ? (thresh*100).toFixed(0)+'%' : '\u2014';
    tableEl.innerHTML = '<table style="border-collapse:collapse;font-size:12px">'
      +'<tr style="border-bottom:2px solid #bbb;font-size:11px">'
      +'<th style="padding:4px 10px;text-align:left">Category</th>'
      +'<th style="padding:4px 10px;text-align:right">'+awayTeam+' rate</th>'
      +'<th style="padding:4px 10px;text-align:right">eff</th>'
      +'<th style="padding:4px 10px;text-align:right">pts/100</th>'
      +'<th style="padding:4px 10px;text-align:right">'+homeTeam+' rate</th>'
      +'<th style="padding:4px 10px;text-align:right">eff</th>'
      +'<th style="padding:4px 10px;text-align:right">pts/100</th>'
      +'<th style="padding:4px 10px;text-align:right">'+awayTeam+' adv</th>'
      +'<th style="padding:4px 10px;text-align:right">OOS '+pctLbl+'</th>'
      +'</tr>'+tableRows.join('')+'</table>'
      +'<p style="font-size:11px;color:#888;margin-top:4px">pts/100 = rate \u00d7 eff \u00b7 '
      +awayTeam+' adv = away\u2212home \u00b7 green \u2265 target\u22125pp \u00b7 orange \u2265\u221215pp \u00b7 red &lt;\u221215pp</p>';
  } else {
    tableEl.innerHTML = '';
  }
}

/* ===================================================================
   GAME LOG
   =================================================================== */
let _gameLogPinnedId = null;

function updateGameLogChart() {
  if (!gameLogData || !ellipseData) return;
  const team = document.getElementById('gamelog-team').value;
  if (!team) return;

  const side       = document.querySelector('input[name="gamelog-side"]:checked').value;
  const pctStr     = document.querySelector('input[name="gamelog-pct"]:checked').value;
  const showGames  = document.getElementById('gamelog-show-games').checked;
  const checked    = Array.from(document.querySelectorAll('#gamelog-categories input:checked')).map(cb => cb.value);
  const activeCats = checked.map(lbl => ELLIPSE_CAT_BY_LABEL[lbl]).filter(Boolean);

  if (!activeCats.length) {
    Plotly.react('gamelog-chart', [], {title:'Select at least one category', height:700, plot_bgcolor:'white', paper_bgcolor:'#fafafa'});
    return;
  }

  const showOff = side === 'off' || side === 'both';
  const showDef = side === 'def' || side === 'both';
  const offGames = gameLogData.games.filter(r => r.team === team);
  const defGames = gameLogData.games.filter(r => r.opp  === team);
  const N = (ellipseData.teams || []).length || 30;

  const traces = [], allX = [], allY = [];

  activeCats.forEach(cat => {
    const lgAvg = gameLogData.league_avgs[cat.label];
    const lgRng = gameLogData.league_ranges[cat.label];
    if (lgAvg && lgRng) {
      traces.push({x:[lgAvg.rate,lgAvg.rate], y:[lgRng.emin,lgRng.emax], mode:'lines', type:'scatter', line:{color:cat.color,width:2.5,dash:'dot'}, opacity:0.75, showlegend:false, hoverinfo:'skip'});
      traces.push({x:[lgRng.rmin,lgRng.rmax], y:[lgAvg.eff,lgAvg.eff],   mode:'lines', type:'scatter', line:{color:cat.color,width:2.5,dash:'dot'}, opacity:0.75, showlegend:false, hoverinfo:'skip'});
    }

    const sides = [];
    if (showOff) sides.push({key:'off', rows:offGames, hollow:false, sideLabel:'Offense'});
    if (showDef) sides.push({key:'def', rows:defGames, hollow:true,  sideLabel:'Defense'});

    sides.forEach(({key, rows, hollow, sideLabel}) => {
      const lg = cat.label + '_' + key;
      const legendName = (showOff && showDef) ? cat.label+' ('+sideLabel+')' : cat.label;
      const validRows = rows.filter(r => isNumeric(r[cat.rate]) && isNumeric(r[cat.eff]));
      if (!validRows.length) return;

      const rVals = validRows.map(r => r[cat.rate]);
      const eVals = validRows.map(r => r[cat.eff]);
      const meanR = rVals.reduce((a,b)=>a+b,0)/rVals.length;
      const meanE = eVals.reduce((a,b)=>a+b,0)/eVals.length;
      allX.push(...rVals); allY.push(...eVals);

      // Coverage ellipse (axis-aligned, per-team fit on game data)
      if (pctStr !== '0' && validRows.length >= 3) {
        const stdR = Math.sqrt(rVals.reduce((s,v)=>s+(v-meanR)**2,0)/(rVals.length-1));
        const stdE = Math.sqrt(eVals.reduce((s,v)=>s+(v-meanE)**2,0)/(eVals.length-1));
        if (stdR > 0 && stdE > 0) {
          const {x, y} = axisEllipseXY(meanR, meanE, stdR, stdE, parseFloat(pctStr));
          traces.push({x, y, mode:'lines', type:'scatter',
            line:{color:cat.color, width:1.5, dash:hollow?'dot':'dash'},
            opacity:0.6, legendgroup:lg, showlegend:false, hoverinfo:'skip'});
        }
      }

      // Game dots
      if (showGames) {
        const xs=[], ys=[], customdata=[];
        const pctDiv = cat.pct_divisor;
        validRows.forEach(r => {
          xs.push(r[cat.rate]); ys.push(r[cat.eff]);
          const pts100 = (r[cat.rate]*r[cat.eff]).toFixed(1);
          const effPct = pctDiv ? ' ('+(r[cat.eff]/pctDiv*100).toFixed(1)+'%)' : '';
          // Defense rows: r.result is from opp's POV — flip W/L and swap scores for our team
          let result = r.result;
          if (hollow && result) {
            const wl = result[0]==='W'?'L':result[0]==='L'?'W':result[0];
            const sc = result.slice(2).split('-');
            result = wl + ' ' + (sc.length===2 ? sc[1]+'-'+sc[0] : result.slice(2));
          }
          const oppName = hollow ? r.team : r.opp;
          const locStr  = hollow ? (r.is_home?'@':'vs') : (r.is_home?'vs':'@');
          customdata.push([r.date, result, r.poss, effPct, pts100, oppName, locStr, r.game_id]);
        });
        const pinnedIdxs = _gameLogPinnedId
          ? validRows.reduce((acc,r,i)=>{ if(r.game_id===_gameLogPinnedId) acc.push(i); return acc; }, [])
          : null;
        const gameDot = {
          x:xs, y:ys, mode:'markers', type:'scatter',
          marker:{size:8, symbol:cat.symbol, color:hollow?'white':cat.color,
                  line:{width:hollow?2:0.8, color:hollow?cat.color:'black'}, opacity:0.45},
          selected:{marker:{size:12, opacity:1.0}},
          unselected:{marker:{opacity:0.12}},
          meta:{traceType:'game'},
          name:legendName, legendgroup:lg, showlegend:true,
          customdata,
          hovertemplate:'<b>'+team+' '+sideLabel+' \u2014 '+cat.label+'</b><br>'
            +'%{customdata[0]}  %{customdata[1]} %{customdata[6]} %{customdata[5]} [%{customdata[2]} poss]<br>'
            +'Rate: %{x:.1f}/100<br>'
            +'Efficiency: %{y:.3f}%{customdata[3]}<br>'
            +'Pts/100: %{customdata[4]}<extra></extra>',
        };
        if (pinnedIdxs !== null) gameDot.selectedpoints = pinnedIdxs;
        traces.push(gameDot);
      }

      // Season average marker
      const offRanks = gameLogData.off_ranks || {};
      const defRanks = gameLogData.def_ranks || {};
      const p100Ranks = key==='off' ? (gameLogData.off_p100_ranks||{}) : (gameLogData.def_p100_ranks||{});
      const rankDf = key==='off' ? offRanks : defRanks;
      // Flip when (defense && !lowerIsBetter) || (offense && lowerIsBetter)
      const _lib = !!cat.lower_is_better;
      const flipR = r => {
        if (!r) return r;
        const flip = (key==='def' && !_lib) || (key==='off' && _lib);
        return flip ? N+1-r : r;
      };
      const rRank    = flipR((rankDf[team]||{})[cat.rate]);
      const eRank    = flipR((rankDf[team]||{})[cat.eff]);
      const p100key  = cat.rate+'+'+cat.eff;
      const p100Rank = flipR((p100Ranks[p100key]||{})[team]);
      const rRankStr = rRank ? '[#'+rRank+'/'+N+']' : '';
      const eRankStr = eRank ? '[#'+eRank+'/'+N+']' : '';
      const pRankStr = p100Rank ? '[#'+p100Rank+'/'+N+']' : '';
      const pctDiv = cat.pct_divisor;
      const avgEffPct = pctDiv ? ' ('+(meanE/pctDiv*100).toFixed(1)+'%)' : '';
      const short = cat.label.split(' ')[0];
      traces.push({
        x:[meanR], y:[meanE], mode:'markers+text', type:'scatter',
        marker:{size:14, symbol:cat.symbol, color:hollow?'white':cat.color,
                line:{width:2, color:hollow?cat.color:'black'}, opacity:1},
        text:[short], textposition:'top center', textfont:{size:9, color:cat.color},
        name:legendName+' avg', legendgroup:lg, showlegend:false,
        hovertemplate:'<b>'+team+' '+sideLabel+' avg \u2014 '+cat.label+'</b> ('+validRows.length+'g)<br>'
          +'Rate: '+meanR.toFixed(1)+'/100  '+rRankStr+'<br>'
          +'Efficiency: '+meanE.toFixed(3)+avgEffPct+'  '+eRankStr+'<br>'
          +'Pts/100: '+(meanR*meanE).toFixed(1)+'  '+pRankStr+'<extra></extra>',
      });
    });

    // Connecting line: off ↔ def for the selected game only
    if (showOff && showDef && showGames && _gameLogPinnedId) {
      const oRow = offGames.find(r => r.game_id===_gameLogPinnedId && isNumeric(r[cat.rate]) && isNumeric(r[cat.eff]));
      const dRow = defGames.find(r => r.game_id===_gameLogPinnedId && isNumeric(r[cat.rate]) && isNumeric(r[cat.eff]));
      if (oRow && dRow) traces.push({
        x:[oRow[cat.rate], dRow[cat.rate]],
        y:[oRow[cat.eff],  dRow[cat.eff]],
        mode:'lines', type:'scatter',
        line:{color:cat.color, width:1.5},
        opacity:0.7, showlegend:false, hoverinfo:'skip',
      });
    }
  });

  const contour = buildContourTraces(allX, allY);

  // Rank annotation
  const annLines = ['<b>'+team+' Season Ranks</b>'];
  activeCats.forEach(cat => {
    const key  = cat.rate+'+'+cat.eff;
    const annLib = !!cat.lower_is_better;
    const opRaw  = ((gameLogData.off_p100_ranks||{})[key]||{})[team];
    const dpRaw  = ((gameLogData.def_p100_ranks||{})[key]||{})[team];
    // flip = isD XOR lib
    const op = opRaw ? (annLib ? N+1-opRaw : opRaw) : null;
    const dp = dpRaw ? (annLib ? dpRaw : N+1-dpRaw) : null;
    const short = (ELLIPSE_SHORT[cat.label]||cat.label).padStart(7).replace(/ /g,'\u00a0');
    const parts = [];
    if (op) parts.push('Off\u00a0#'+op);
    if (dp) parts.push('Def\u00a0#'+dp);
    if (parts.length) annLines.push(short+': '+parts.join(' '));
  });
  const annotations = [];
  if (annLines.length > 1)
    annotations.push({text:annLines.join('<br>'), xref:'paper', yref:'paper', x:0.98, y:0.98,
      xanchor:'right', yanchor:'top', showarrow:false,
      font:{size:11, family:'monospace'}, align:'left',
      bgcolor:'rgba(255,255,255,0.85)', bordercolor:'#ccc', borderwidth:1, borderpad:6});

  const sideLabel = side==='off'?'Offense':side==='def'?'Defense':'Both';
  const el = document.getElementById('gamelog-chart');
  Plotly.react('gamelog-chart', contour.traces.concat(traces), {
    title:{text:team+' \u2014 per-game Rate vs Efficiency'
      +'<span style="font-size:12px;color:gray"> (contours = pts contributed / 100 poss)</span>',
      font:{size:15}},
    xaxis:{title:'Per 100 Possessions', showgrid:true, gridcolor:'lightgray', zeroline:false},
    yaxis:{title:'Points Per Event', showgrid:true, gridcolor:'lightgray', zeroline:false},
    height:700, showlegend:true,
    legend:{orientation:'h', yanchor:'top', y:-0.12, xanchor:'center', x:0.5},
    margin:{l:50, r:60, t:40, b:90},
    plot_bgcolor:'white', paper_bgcolor:'#fafafa',
    annotations:annotations.concat(contour.annotations),
  }, {displayModeBar:false});

  // Helper: apply selectedpoints to all game traces
  function _applyGameHighlight(gameId) {
    const gd2 = document.getElementById('gamelog-chart');
    const sps=[], idxs=[];
    (gd2.data||[]).forEach((tr,i) => {
      if (tr.meta && tr.meta.traceType==='game') {
        idxs.push(i);
        if (gameId) {
          sps.push((tr.customdata||[]).reduce((acc,c,j)=>{ if(c[7]===gameId) acc.push(j); return acc; }, []));
        } else {
          sps.push(null);
        }
      }
    });
    if (idxs.length) Plotly.restyle('gamelog-chart', 'selectedpoints', sps, idxs);
  }

  // Click-to-pin
  if (el._gameLogClick) el.removeListener('plotly_click', el._gameLogClick);
  el._gameLogClick = function(d) {
    if (!d || !d.points || !d.points[0]) return;
    const cd = d.points[0].customdata;
    if (!cd || !cd[7]) return;
    const gameId = cd[7];
    if (_gameLogPinnedId === gameId) {
      _gameLogPinnedId = null;
      document.getElementById('gamelog-game-select').value = '';
      document.getElementById('gamelog-pinned-label').textContent = '';
    } else {
      _gameLogPinnedId = gameId;
      document.getElementById('gamelog-game-select').value = gameId;
      document.getElementById('gamelog-pinned-label').textContent =
        'Pinned: ' + cd[0] + '  ' + cd[6] + ' ' + cd[5] + '  ' + cd[1];
    }
    updateGameLogChart();
  };
  el.on('plotly_click', el._gameLogClick);

  // Hover dimming
  if (el._gameLogHover) el.removeListener('plotly_hover', el._gameLogHover);
  if (el._gameLogUnhover) el.removeListener('plotly_unhover', el._gameLogUnhover);
  el._gameLogHover = function(d) {
    if (!d || !d.points || !d.points[0]) return;
    const cd = d.points[0].customdata;
    if (!cd || !cd[7]) return;
    _applyGameHighlight(cd[7]);
  };
  el._gameLogUnhover = function() {
    _applyGameHighlight(_gameLogPinnedId);
  };
  el.on('plotly_hover', el._gameLogHover);
  el.on('plotly_unhover', el._gameLogUnhover);
}

/* ===================================================================
   INITIALIZATION
   =================================================================== */
function buildRateCategoryCheckboxes() {
  const container = document.getElementById('rate-categories');
  ALL_CATEGORIES.forEach(cat => {
    if (cat.label === 'Blocks') return;
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = cat.label;
    const defaultCats = new Set(['Close (\u22645ft)', 'Mid-Range', '3-Pointer']);
    cb.checked = defaultCats.has(cat.label);
    cb.addEventListener('change', updateRateChart);
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + cat.label));
    container.appendChild(label);
  });
}

function buildEllipseCategoryCheckboxes(containerId, onChange, defaultSet) {
  defaultSet = defaultSet || ELLIPSE_DEFAULT;
  const container = document.getElementById(containerId);
  ELLIPSE_CATEGORIES.forEach(cat => {
    const label = document.createElement('label');
    label.style.cssText = 'cursor:pointer;font-size:14px';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = cat.label;
    cb.checked = defaultSet.has(cat.label);
    cb.addEventListener('change', onChange);
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + cat.label));
    container.appendChild(label);
  });
}

async function init() {
  buildRateCategoryCheckboxes();
  buildEllipseCategoryCheckboxes('matchup-categories', updateMatchupChart);
  buildEllipseCategoryCheckboxes('gamelog-categories', updateGameLogChart);

  const [seasonResp, playerResp, ellipseResp, gameLogResp] = await Promise.all([
    fetch('season_stats.json'),
    fetch('player_stats.json'),
    fetch('ellipse_model.json'),
    fetch('game_log.json'),
  ]);
  seasonData  = await seasonResp.json();
  playerData  = await playerResp.json();
  ellipseData = await ellipseResp.json();
  gameLogData = await gameLogResp.json();

  // Build ellipseModelMap
  (ellipseData.categories || []).forEach(cat => {
    ellipseModelMap[cat.rate + '+' + cat.eff] = cat;
  });

  // Season explorer
  const seasonCols = getNumericCols(seasonData, SEASON_EXCLUDE);
  const seasonX = document.getElementById('season-x');
  const seasonY = document.getElementById('season-y');
  populateSelect(seasonX, seasonCols, friendlySeason);
  populateSelect(seasonY, seasonCols, friendlySeason);
  seasonX.value = 'pts_per100';
  seasonY.value = 'opp_pts_per100';
  document.getElementById('season-stat-line').textContent =
    `${seasonData[0].games} games loaded \u00B7 ${seasonData.length} teams \u00B7 ${seasonCols.length} variables`;

  // Player explorer
  const playerCols = getNumericCols(playerData, PLAYER_EXCLUDE);
  const playerX = document.getElementById('player-x');
  const playerY = document.getElementById('player-y');
  populateSelect(playerX, playerCols, friendlyPlayer);
  populateSelect(playerY, playerCols, friendlyPlayer);
  playerX.value = 'usage_pct';
  playerY.value = 'ts_pct';

  const playerTeamSet = new Set(playerData.map(r => r.team_abbr));
  const playerTeams   = Array.from(playerTeamSet).sort();
  const teamSel = document.getElementById('player-team');
  const allOpt  = document.createElement('option');
  allOpt.value = 'ALL'; allOpt.textContent = 'All Teams';
  teamSel.appendChild(allOpt);
  playerTeams.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    teamSel.appendChild(opt);
  });

  const qualPlayers = playerData.filter(r => r.poss_played >= 200);
  document.getElementById('player-stat-line').textContent =
    `${qualPlayers.length} players \u00B7 ${playerCols.length} variables`;

  // Event listeners — Season / Player / Rate
  seasonX.addEventListener('change', updateSeasonChart);
  seasonY.addEventListener('change', updateSeasonChart);
  playerX.addEventListener('change', updatePlayerChart);
  playerY.addEventListener('change', updatePlayerChart);
  teamSel.addEventListener('change', updatePlayerChart);
  document.getElementById('player-min-poss').addEventListener('change', updatePlayerChart);
  document.querySelectorAll('input[name="rate-side"]').forEach(r => r.addEventListener('change', updateRateChart));
  document.getElementById('rate-show-avg').addEventListener('change', updateRateChart);
  document.getElementById('rate-connect-dots').addEventListener('change', updateRateChart);

  // Matchup dropdowns (from ellipseData.teams)
  const ellipseTeams  = ellipseData.teams || [];
  const matchupAway   = document.getElementById('matchup-away');
  const matchupHome   = document.getElementById('matchup-home');
  ellipseTeams.forEach(t => {
    [matchupAway, matchupHome].forEach(sel => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      sel.appendChild(opt);
    });
  });
  matchupAway.value = ellipseTeams.includes('GSW') ? 'GSW' : ellipseTeams[0];
  matchupHome.value = ellipseTeams.includes('BOS') ? 'BOS' : (ellipseTeams[1] || ellipseTeams[0]);
  matchupAway.addEventListener('change', updateMatchupChart);
  matchupHome.addEventListener('change', updateMatchupChart);
  document.getElementById('matchup-swap').addEventListener('click', () => {
    const tmp = matchupAway.value;
    matchupAway.value = matchupHome.value;
    matchupHome.value = tmp;
    updateMatchupChart();
  });
  document.querySelectorAll('input[name="matchup-pct"]').forEach(r => r.addEventListener('change', updateMatchupChart));
  document.querySelectorAll('input[name="matchup-avg"]').forEach(r => r.addEventListener('change', updateMatchupChart));
  document.getElementById('matchup-show-center').addEventListener('change', updateMatchupChart);
  document.getElementById('matchup-show-delta').addEventListener('change', updateMatchupChart);
  document.getElementById('matchup-show-games').addEventListener('change', updateMatchupChart);

  // Game log team dropdown
  const gameLogTeams = [...new Set(gameLogData.games.map(r => r.team))].sort();
  const gameLogSel   = document.getElementById('gamelog-team');
  gameLogTeams.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    gameLogSel.appendChild(opt);
  });
  gameLogSel.value = gameLogTeams.includes('GSW') ? 'GSW' : gameLogTeams[0];

  // Populate game-select dropdown and re-populate on team change
  function populateGameSelect(team) {
    const sel = document.getElementById('gamelog-game-select');
    sel.innerHTML = '<option value="">Select or click a game\u2026</option>';
    _gameLogPinnedId = null;
    document.getElementById('gamelog-pinned-label').textContent = '';
    const games = gameLogData.games.filter(r => r.team === team)
      .sort((a,b) => a.game_id < b.game_id ? 1 : -1); // newest first
    games.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.game_id;
      const loc = r.is_home ? 'vs' : '@';
      opt.textContent = r.date + '  ' + (r.result||'') + ' ' + loc + ' ' + r.opp;
      sel.appendChild(opt);
    });
  }
  populateGameSelect(gameLogSel.value);

  gameLogSel.addEventListener('change', () => {
    populateGameSelect(gameLogSel.value);
    updateGameLogChart();
  });
  document.getElementById('gamelog-game-select').addEventListener('change', function() {
    const gid = this.value;
    if (!gid) {
      _gameLogPinnedId = null;
      document.getElementById('gamelog-pinned-label').textContent = '';
    } else {
      _gameLogPinnedId = gid;
      const r = gameLogData.games.find(g => g.game_id === gid && g.team === gameLogSel.value);
      if (r) document.getElementById('gamelog-pinned-label').textContent =
        'Pinned: ' + r.date + '  ' + (r.result||'') + ' ' + (r.is_home?'vs':'@') + ' ' + r.opp;
    }
    updateGameLogChart();
  });
  document.querySelectorAll('input[name="gamelog-side"]').forEach(r => r.addEventListener('change', updateGameLogChart));
  document.querySelectorAll('input[name="gamelog-pct"]').forEach(r => r.addEventListener('change', updateGameLogChart));
  document.getElementById('gamelog-show-games').addEventListener('change', updateGameLogChart);

  // Initial renders
  updateSeasonChart();
  updatePlayerChart();
  updateRateChart();
  updateMatchupChart();
  updateGameLogChart();
}

init();
</script>
</body>
</html>
